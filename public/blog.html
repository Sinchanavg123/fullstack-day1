<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | DevBlog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="logo">DevBlog</div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="blog.html">Blog</a></li>
        </ul>

    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <h1>Latest Blog Articles</h1>

        <p>Stay updated with web development trends and programming tutorials.</p>

        <a href="index.html" class="btn">Back to Home</a>

    </section>

    <!-- Blog Section -->
    <section class="container">

<h2 class="title">Add New Blog</h2>

<form id="blogForm">

<div class="form-group">

<label>Blog Title</label>

<input
type="text"
id="title"
placeholder="Enter Blog Title">

<small id="titleError"></small>

</div>

<div class="form-group">

<label>Author Name</label>

<input
type="text"
id="author"
placeholder="Enter Author Name">

<small id="authorError"></small>

</div>

<div class="form-group">

<label>Blog Content</label>

<textarea
id="content"
rows="6"
placeholder="Write your blog here..."></textarea>

<small id="contentError"></small>

</div>

<button class="submit-btn">
Publish Blog
</button>

</form>

</section>

<hr>

<section class="container">

<h2 class="title">Published Blogs</h2>

<div class="cards" id="blogContainer">

</div>

</section>
    <footer>

        <p>© 2025 DevBlog | Designed by Sinchana | All Rights Reserved</p>

    </footer>


<script src="script.js"></script>

</body>
</html>
