<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | DevBlog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="logo">DevBlog</div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="blog.html" class="active">Blog</a></li>
        </ul>

    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <h1>Manage Your Blogs</h1>

        <p>Create, edit and manage your blog posts with ease.</p>

        <a href="index.html" class="btn">Back to Home</a>

    </section>

    <!-- Add/Edit Blog Form -->
    <section class="container">

        <h2 class="title">Add / Edit Blog</h2>

        <form id="blogForm">

            <!-- Hidden field used while editing -->
            <input type="hidden" id="blogId">

            <div class="form-group">

                <label for="title">Blog Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter Blog Title">

                <small id="titleError"></small>

            </div>

            <div class="form-group">

                <label for="author">Author Name</label>

                <input
                    type="text"
                    id="author"
                    placeholder="Enter Author Name">

                <small id="authorError"></small>

            </div>

            <div class="form-group">

                <label for="content">Blog Content</label>

                <textarea
                    id="content"
                    rows="6"
                    placeholder="Write your blog here..."></textarea>

                <small id="contentError"></small>

            </div>

            <button type="submit" class="submit-btn">

                Publish / Update Blog

            </button>

        </form>

    </section>

    <!-- Published Blogs -->
    <section class="container">

        <h2 class="title">Published Blogs</h2>

        <div class="cards" id="blogContainer">

            <!-- Blog cards are added dynamically -->

        </div>

    </section>

    <!-- Footer -->
    <footer>

        <p>© 2025 DevBlog | Designed by Sinchana | All Rights Reserved</p>

    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
